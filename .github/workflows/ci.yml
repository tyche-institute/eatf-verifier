name: CI

on:
  push:
  pull_request:

jobs:
  published-conference-bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install the published Python verifier
        run: python -m pip install "eatf-verifier @ https://github.com/tyche-institute/eatf-verifier/archive/refs/tags/v0.6.1.zip#subdirectory=lib-python"
      - name: Download and replay the published conference ZIP
        run: python tests/check_published_conference_bundle.py

  release-python-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the documented v0.6.1 Python release
        run: python -m pip install "eatf-verifier @ https://github.com/tyche-institute/eatf-verifier/archive/refs/tags/v0.6.1.zip#subdirectory=lib-python"
      - name: Check the installed version and CLI
        run: |
          python -c "import importlib.metadata as m; assert m.version('eatf-verifier') == '0.6.1'"
          eatf-verify-py --help
          eatf-verify-py --require-pqc test-vectors/valid/hybrid-mldsa65/package.aep

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: python -m pip install -e "lib-python[dev]"
      - run: python -m ruff check lib-python
      - run: python -m pytest lib-python/tests
      - run: node cli/eatf-verify/bin/eatf-verify.js --conformance test-vectors
      - run: python -m eatf_verifier.cli --conformance test-vectors
      - run: node cli/eatf-verify/bin/eatf-verify.js --require-pqc test-vectors/valid/hybrid-mldsa65/package.aep
      - run: python -m eatf_verifier.cli --require-pqc test-vectors/valid/hybrid-mldsa65/package.aep
      - run: python workshops/pqc-hybrid-lab/run_lab.py
      - run: python experiments/decision-path/run_experiment.py

  reviewer-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: bash bin/setup.sh
      - run: npm run test:toolkit
      - name: Check deterministic PQC workshop artifacts
        run: |
          TZ=UTC node scripts/generate-pqc-workshop.mjs
          git diff --exit-code -- workshops/pqc-hybrid-lab test-vectors/valid/hybrid-mldsa65 test-vectors/invalid/bad-signature-pqc
          TZ=Europe/Berlin node scripts/generate-pqc-workshop.mjs
          git diff --exit-code -- workshops/pqc-hybrid-lab test-vectors/valid/hybrid-mldsa65 test-vectors/invalid/bad-signature-pqc
      - name: Build conference download bundle
        run: npm run build:conference-assets
      - name: Check extracted conference download bundle
        run: .venv/bin/python tests/check_conference_bundle.py
      - run: .venv/bin/python experiments/decision-path/run_experiment.py
      - name: Check npm tarballs
        run: |
          npm pack --dry-run --workspace=@eatf/verifier
          npm pack --dry-run --workspace=@eatf/sign-cli
          npm pack --dry-run --workspace=@eatf/inspect-cli
          npm pack --dry-run --workspace=@eatf/verify-cli
      - name: Check Python distributions
        run: |
          .venv/bin/python -m build lib-python
          .venv/bin/twine check lib-python/dist/*
