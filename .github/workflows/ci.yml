name: CI

on:
  push:
  pull_request:

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: python -m pip install -e "lib-python[dev]"
      - run: python -m ruff check lib-python
      - run: python -m pytest lib-python/tests
      - run: node cli/eatf-verify/bin/eatf-verify.js --conformance test-vectors
      - run: python -m eatf_verifier.cli --conformance test-vectors

  reviewer-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: bash bin/setup.sh
      - run: npm run test:toolkit
      - name: Check npm tarballs
        run: |
          npm pack --dry-run --workspace=@eatf/verifier
          npm pack --dry-run --workspace=@eatf/sign-cli
          npm pack --dry-run --workspace=@eatf/inspect-cli
          npm pack --dry-run --workspace=@eatf/verify-cli
      - name: Check Python distributions
        run: |
          .venv/bin/python -m build lib-python
          .venv/bin/twine check lib-python/dist/*
