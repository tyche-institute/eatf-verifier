[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eatf-verifier"
version = "0.5.0"
description = "Offline Python verifier for EATF .aep evidence packages; same conformance contract as the TypeScript implementation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Anton Sokolov", email = "dev@tyche.institute" }]
keywords = ["eatf", "verifier", "aep", "offline", "ai-act", "evidence", "post-quantum"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "cryptography>=42",
  "asn1crypto>=1.5",
  "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
pqc = ["liboqs-python>=0.16"]
dev = ["build>=1.2", "jsonschema[format]>=4.23", "pytest>=7", "ruff>=0.4", "twine>=5"]

[project.scripts]
eatf-verify-py = "eatf_verifier.cli:main"

[project.urls]
homepage = "https://github.com/tyche-institute/eatf-verifier/tree/main/lib-python"
repository = "https://github.com/tyche-institute/eatf-verifier"
issues = "https://github.com/tyche-institute/eatf-verifier/issues"

[tool.setuptools.packages.find]
include = ["eatf_verifier*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"eatf_verifier/overt.py" = ["BLE001"]
"eatf_verifier/tsa.py" = ["BLE001", "S110"]
"eatf_verifier/verifier.py" = ["BLE001"]
